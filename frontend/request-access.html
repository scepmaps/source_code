<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Request access — SCEPMAPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <style>
      :root{
        --bg:#0b1020;
        --bg-2:#0e1530;
        --card:#0f1a39cc;
        --stroke:#243167;
        --text:#d7e3ff;
        --muted:#8aa0d6;
        --accent:#4de2ff;
        --accent-2:#7a5cff;
        --danger:#ff4d6d;
        --ok:#3dd68c;
        --shadow: 0 10px 30px rgba(0,0,0,.4);
        --radius:16px;
      }

      *{box-sizing:border-box}

      body {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(1200px 700px at 80% -10%, #1a2a6cff, transparent 60%),
                    radial-gradient(1000px 600px at -10% 120%, #162447ff, transparent 55%),
                    var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 32px 16px 48px;
        overflow-x: hidden;
        overflow-y: auto;
      }

      body::before{
        content:"";
        position:fixed;
        inset:0;
        pointer-events:none;
        opacity:.25;
        mix-blend-mode:overlay;
        background-image: linear-gradient(var(--stroke) 1px, transparent 1px),
                          linear-gradient(90deg, var(--stroke) 1px, transparent 1px);
        background-size: 28px 28px;
      }

      #particleCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .login-container {
        position: relative;
        z-index: 10;
        text-align: center;
        width: min(520px, 100%);
      }

      .login-logo {
        font-family: 'Orbitron', monospace;
        font-size: 2.5rem;
        font-weight: 600;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        margin-bottom: 1.25rem;
        letter-spacing: 2px;
        animation: logoGlow 2s ease-in-out infinite alternate;
      }

      .card {
        background: var(--card);
        border: 1px solid rgba(77, 226, 255, 0.1);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 28px 32px 32px;
        backdrop-filter: blur(20px);
        text-align: left;
      }

      h1 {
        margin: 0 0 8px 0;
        font-size: 24px;
        font-weight: 600;
        color: var(--text);
        text-align: center;
      }

      .subtitle {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        text-align: center;
      }

      label.field-label {
        display: block;
        margin: 12px 0 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
        text-transform: uppercase;
      }

      input[type="text"],
      input[type="email"],
      textarea {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--stroke);
        background: var(--bg-2);
        color: var(--text);
        margin: 0;
        font-size: 15px;
        font-family: inherit;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      textarea {
        min-height: 88px;
        resize: vertical;
        line-height: 1.4;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(77, 226, 255, 0.1);
      }

      .features {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 12px;
        margin-top: 4px;
      }

      @media (max-width: 480px) {
        .features { grid-template-columns: 1fr; }
      }

      .feature {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: rgba(15, 27, 59, 0.45);
        cursor: pointer;
        user-select: none;
        font-size: 13px;
        color: var(--text);
        line-height: 1.35;
      }

      .feature:hover {
        border-color: rgba(77, 226, 255, 0.25);
      }

      .feature input {
        margin-top: 2px;
        accent-color: var(--accent);
        flex: 0 0 auto;
      }

      .hp {
        position: absolute !important;
        left: -10000px !important;
        top: auto !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      button {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid #2a3a7a;
        background: linear-gradient(180deg, #0f1b3b, #0b142f);
        color: var(--text);
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s ease;
        margin-top: 18px;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(77, 226, 255, 0.2);
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .msg {
        min-height: 20px;
        font-size: 14px;
        margin: 0 0 8px;
        text-align: center;
      }

      .msg.err { color: var(--danger); }
      .msg.ok { color: var(--ok); }

      .back-link {
        display: block;
        margin-top: 16px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        text-decoration: none;
      }

      .back-link:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      @keyframes logoGlow {
        0% { filter: drop-shadow(0 0 10px var(--accent)) brightness(1); }
        100% { filter: drop-shadow(0 0 20px var(--accent)) brightness(1.2); }
      }
    </style>
  </head>
  <body>
    <canvas id="particleCanvas"></canvas>
    <div class="login-container">
      <div class="login-logo">SCEPMAPS</div>
      <div class="card">
        <h1>Request access</h1>
        <p class="subtitle">Tell us who you are and which capabilities you need. We’ll review your request and get back to you.</p>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>

        <form id="accessForm" novalidate>
          <!-- Honeypot — leave empty -->
          <label class="hp" aria-hidden="true">Company website
            <input type="text" name="website" id="website" tabindex="-1" autocomplete="off" />
          </label>

          <label class="field-label" for="name">Full name</label>
          <input id="name" name="name" type="text" maxlength="120" autocomplete="name" required placeholder="Ex : Noel Flantier" />

          <label class="field-label" for="company">Company / organization</label>
          <input id="company" name="company" type="text" maxlength="160" autocomplete="organization" required placeholder="Ex : SCEP" />

          <label class="field-label" for="email">Professional email</label>
          <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required placeholder="Ex : Noel.flantier@scep.com" />

          <label class="field-label">Required features</label>
          <div class="features" id="features">
            <label class="feature"><input type="checkbox" name="features" value="Map export (GeoTIFF)" /> Map export (GeoTIFF)</label>
            <label class="feature"><input type="checkbox" name="features" value="HGT elevation export" /> HGT elevation export</label>
            <label class="feature"><input type="checkbox" name="features" value="Satellite / imagery basemaps" /> Satellite / imagery</label>
            <label class="feature"><input type="checkbox" name="features" value="Topo / navigation basemaps" /> Topo / navigation maps</label>
            <label class="feature"><input type="checkbox" name="features" value="Nautical charts (SHOM / UKHO)" /> Nautical charts</label>
            <label class="feature"><input type="checkbox" name="features" value="Aviation overlays (OpenAIP / GB South)" /> Aviation overlays</label>
            <label class="feature"><input type="checkbox" name="features" value="Seamarks / density / history overlays" /> Other overlays</label>
            <label class="feature"><input type="checkbox" name="features" value="Draw &amp; KML tools" /> Draw &amp; KML tools</label>
            <label class="feature"><input type="checkbox" name="features" value="Mobile access" /> Mobile access</label>
            <label class="feature"><input type="checkbox" name="features" value="Admin / multi-user workspace" /> Admin / multi-user</label>
          </div>

          <label class="field-label" for="otherFeatures">Other needs (optional)</label>
          <textarea id="otherFeatures" name="otherFeatures" maxlength="1000" placeholder="Anything else we should know…"></textarea>

          <label class="field-label" for="message">Message (optional)</label>
          <textarea id="message" name="message" maxlength="2000" placeholder="Use case, team size, timeline…"></textarea>

          <button type="submit" id="sendBtn">Send request</button>
        </form>

        <a class="back-link" href="login.html">← Back to sign in</a>
      </div>
    </div>

    <script>
      class MappingGrid {
        constructor(canvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext('2d');
          this.mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
          this.gridSize = 60;
          this.time = 0;
          this.waypoints = [];
          this.mouseRadius = 200;
          this.scanLines = [];
          this.resize();
          this.createWaypoints();
          this.createScanLines();
          this.bindEvents();
          this.animate();
        }
        resize() {
          this.canvas.width = window.innerWidth;
          this.canvas.height = window.innerHeight;
        }
        createWaypoints() {
          this.waypoints = [];
          const cols = Math.ceil(this.canvas.width / this.gridSize) + 1;
          const rows = Math.ceil(this.canvas.height / this.gridSize) + 1;
          for (let x = 0; x < cols; x++) {
            for (let y = 0; y < rows; y++) {
              this.waypoints.push({
                x: x * this.gridSize, y: y * this.gridSize,
                baseX: x * this.gridSize, baseY: y * this.gridSize,
                active: false, elevation: 0
              });
            }
          }
        }
        createScanLines() {
          this.scanLines = [{ angle: 0, length: 0, maxLength: Math.hypot(this.canvas.width, this.canvas.height), speed: 2 }];
        }
        bindEvents() {
          window.addEventListener('resize', () => this.resize());
          window.addEventListener('mousemove', (e) => { this.mouse.x = e.clientX; this.mouse.y = e.clientY; });
        }
        updateWaypoints() {
          this.waypoints.forEach(point => {
            const dx = this.mouse.x - point.baseX;
            const dy = this.mouse.y - point.baseY;
            const distance = Math.hypot(dx, dy);
            if (distance < this.mouseRadius) {
              const force = (this.mouseRadius - distance) / this.mouseRadius;
              point.elevation = force * 20;
              point.active = true;
              const angle = Math.atan2(dy, dx);
              point.x = point.baseX + Math.cos(angle) * force * 15;
              point.y = point.baseY + Math.sin(angle) * force * 15;
            } else {
              point.elevation *= 0.95;
              point.active = distance < this.mouseRadius * 1.5;
              point.x += (point.baseX - point.x) * 0.1;
              point.y += (point.baseY - point.y) * 0.1;
            }
          });
        }
        drawCoordinateGrid() {
          this.ctx.strokeStyle = 'rgba(77, 226, 255, 0.15)';
          this.ctx.lineWidth = 0.5;
          for (let x = 0; x <= this.canvas.width; x += this.gridSize) {
            this.ctx.beginPath(); this.ctx.moveTo(x, 0); this.ctx.lineTo(x, this.canvas.height); this.ctx.stroke();
          }
          for (let y = 0; y <= this.canvas.height; y += this.gridSize) {
            this.ctx.beginPath(); this.ctx.moveTo(0, y); this.ctx.lineTo(this.canvas.width, y); this.ctx.stroke();
          }
        }
        drawWireframeMesh() {
          for (let i = 0; i < this.waypoints.length; i++) {
            const point = this.waypoints[i];
            for (let j = i + 1; j < this.waypoints.length; j++) {
              const other = this.waypoints[j];
              const distance = Math.hypot(point.x - other.x, point.y - other.y);
              if (distance < this.gridSize * 1.5 && (point.active || other.active)) {
                const opacity = Math.max(0.05, 0.3 - distance / (this.gridSize * 2));
                this.ctx.strokeStyle = `rgba(77, 226, 255, ${opacity})`;
                this.ctx.beginPath();
                this.ctx.moveTo(point.x, point.y - point.elevation);
                this.ctx.lineTo(other.x, other.y - other.elevation);
                this.ctx.stroke();
              }
            }
          }
        }
        drawWaypoints() {
          this.waypoints.forEach(point => {
            if (point.active || point.elevation > 0.1) {
              this.ctx.fillStyle = point.active ? '#4de2ff' : 'rgba(77, 226, 255, 0.5)';
              this.ctx.beginPath();
              this.ctx.arc(point.x, point.y - point.elevation, 1.5 + point.elevation * 0.2, 0, Math.PI * 2);
              this.ctx.fill();
            }
          });
        }
        drawRadarScan() {
          const scan = this.scanLines[0];
          scan.length += scan.speed * 0.5;
          if (scan.length > scan.maxLength * 0.5) scan.length = 0;
          const endX = this.mouse.x + Math.cos(scan.angle + this.time * 0.01) * scan.length;
          const endY = this.mouse.y + Math.sin(scan.angle + this.time * 0.01) * scan.length;
          const gradient = this.ctx.createLinearGradient(this.mouse.x, this.mouse.y, endX, endY);
          gradient.addColorStop(0, 'rgba(77, 226, 255, 0.2)');
          gradient.addColorStop(1, 'transparent');
          this.ctx.strokeStyle = gradient;
          this.ctx.lineWidth = 1;
          this.ctx.beginPath();
          this.ctx.moveTo(this.mouse.x, this.mouse.y);
          this.ctx.lineTo(endX, endY);
          this.ctx.stroke();
        }
        animate() {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          this.time++;
          this.drawCoordinateGrid();
          this.updateWaypoints();
          this.drawWireframeMesh();
          this.drawWaypoints();
          this.drawRadarScan();
          requestAnimationFrame(() => this.animate());
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('particleCanvas');
        if (canvas) new MappingGrid(canvas);
      });
    </script>

    <script>
      const form = document.getElementById('accessForm');
      const msg = document.getElementById('msg');
      const sendBtn = document.getElementById('sendBtn');
      const startedAt = Date.now();

      const setMsg = (text, kind) => {
        msg.textContent = text || '';
        msg.className = 'msg' + (kind ? ' ' + kind : '');
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        setMsg('');

        const name = document.getElementById('name').value.trim();
        const company = document.getElementById('company').value.trim();
        const email = document.getElementById('email').value.trim();
        const otherFeatures = document.getElementById('otherFeatures').value.trim();
        const message = document.getElementById('message').value.trim();
        const website = document.getElementById('website').value;
        const features = [...form.querySelectorAll('input[name="features"]:checked')].map((el) => el.value);

        if (!name || !company || !email) {
          setMsg('Please fill in name, company, and professional email.', 'err');
          return;
        }
        if (!features.length && !otherFeatures) {
          setMsg('Select at least one feature or describe your needs.', 'err');
          return;
        }

        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending…';

        try {
          const res = await fetch('/auth/request-access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              name,
              company,
              email,
              features,
              other_features: otherFeatures,
              message,
              website,
              started_at: startedAt
            })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            setMsg(data.error || 'Could not send your request. Please try again later.', 'err');
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send request';
            return;
          }
          setMsg(data.message || 'Request sent. We will contact you soon.', 'ok');
          form.reset();
          sendBtn.textContent = 'Request sent';
        } catch (_) {
          setMsg('Network error. Please try again.', 'err');
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send request';
        }
      });
    </script>
  </body>
</html>
